substitutions:
  name: esphome-web-2cb4b8
  friendly_name: Loud-ESP32S3-Plus

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.4.1
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

      CONFIG_ESP32_S3_BOX_BOARD: "y"

      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"

      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"  
      
# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:

ota:
  platform: esphome
  password: !secret esphome_ota_password

wifi:
  ssid: !secret esphome_wifi_ssid
  password: !secret esphome_wifi_password
  ap:
    ssid: "${friendly_name} Hotspot"
    password: !secret esphome_ap_password

psram:
  mode: octal
  speed: 80MHz

external_components:
  # for production, use the released version
  # - source: github://sonocotta/esphome-ma12070p
  # for local development, use relative path
  - source: ../..
    components: [ ma12070p ]
    refresh: 0s

globals:
  - id: current_volume
    type: float

i2c:
  sda: GPIO8
  scl: GPIO9
  frequency: 400kHz
  scan: True

audio_dac:
  - platform: ma12070p
    id: ma12070p_dac
    enable_pin: GPIO17      # ENABLE, When pulled high, the device is reset and kept in an inactive state with minimum power consumption.
    mute_pin: GPIO18        # MUTE, Mute audio output when pulled low
    volume_max: 0dB         # maximum volume range 0dB, can go up to +24dB
    volume_min: -80dB       # minimum volume range -60dB, can go down to -144dB
    debug: true             # Dumps all I2C communication to the log, useful for debugging and reverse engineering, but can cause performance issues and log flooding, so use with caution. --- IGNORE ---

i2s_audio:
  i2s_lrclk_pin: GPIO15
  i2s_bclk_pin: GPIO14

speaker:
  - platform: i2s_audio
    id: speaker_id
    dac_type: external
    i2s_dout_pin: GPIO16
    audio_dac: ma12070p_dac
    channel: stereo
    sample_rate: 48000
    bits_per_sample: 32bit    # MA12070P requires 32-bit I2S slot width (64 BCLK/frame)
    timeout: never

  - platform: mixer
    id: mixer_speaker_id
    output_speaker: speaker_id
    source_speakers:
      - id: announcement_spk_mixer_input
        timeout: never
      - id: media_spk_mixer_input
        timeout: never

  - platform: resampler
    id: media_spk_resampling_input
    output_speaker: media_spk_mixer_input

  - platform: resampler
    id: announcement_spk_resampling_input
    output_speaker: announcement_spk_mixer_input

media_player:
  - platform: speaker
    name: Mediaplayer
    id: loud_mediaplayer
    buffer_size: 100000
    volume_increment: 10%
    volume_initial: 10%
    media_pipeline:
      speaker: media_spk_resampling_input
      num_channels: 2
    announcement_pipeline:
       speaker: announcement_spk_resampling_input
       num_channels: 1

    on_play:
      - if:
          condition:
            switch.is_on: mute_dac
          then:
            switch.turn_off: mute_dac

    on_announcement:
      - if:
          condition:
            switch.is_on: mute_dac
          then:
            switch.turn_off: mute_dac

      - lambda: id(current_volume) = id(ma12070p_dac).volume();

      - mixer_speaker.apply_ducking:
            id: media_spk_mixer_input
            decibel_reduction: 40
            duration: 0.00s
      - wait_until:
            media_player.is_announcing:
      - delay: 0.75s
      - lambda: id(ma12070p_dac).set_volume(id(announce_volume).state / 100);

      - wait_until:
          not:
            media_player.is_announcing:
      - mixer_speaker.apply_ducking:
            id: media_spk_mixer_input
            decibel_reduction: 0
            duration: 1.0s
      - lambda: id(ma12070p_dac).set_volume(id(current_volume));

switch:
  - platform: ma12070p
    enable_dac:
      name: DAC Enable
      id: enable_dac
      restore_mode: ALWAYS_ON

    mute:
      name: DAC Mute
      id: mute_dac
      restore_mode: ALWAYS_ON

number:
  - platform: template
    name: Announce Volume
    id: announce_volume
    icon: mdi:volume-source
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    restore_value: true
    initial_value: 50
    optimistic: true

interval:
  - interval: 60s
    then:
      - if:
          condition:
            - switch.is_off: mute_dac
            - for:
                time: 120s
                condition:
                  or:
                    - media_player.is_idle: loud_mediaplayer
                    - media_player.is_paused: loud_mediaplayer
          then:
            - switch.turn_on: mute_dac
